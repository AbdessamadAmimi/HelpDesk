    <main>
        <section class="formulaire">
            <h1>Gestion des demandes</h1>
            <p>Suivez et gérez les incidents informatiques.</p>
            <form action="">
                <div class="top-form">
                    <h3>Créer une demande</h3>
                    <p>Décrivez votre problème informatique.</p>
                </div>
                <div class="champs">
                    <div class="titre">
                        <label for="">Titre du problème *</label>
                        <input type="text" id="titre" placeholder="Connexion Wi-Fi instable">
                        <p class="erreur_titre hidden">Entrer un titre valid</p>
                    </div>

                    <div class="catégorie_">
                        <label for="">Catégorie *</label>
                        <select name="" id="categorie">
                            <option value="Réseau">Réseau</option>
                            <option value="Logiciel">Logiciel</option>
                            <option value="Matériel">Matériel</option>
                        </select>
                    </div>

                    <div class="priorité">
                        <label for="">Priorité *</label>
                        <select name="" id="priorite">
                            <option value="Basse">Basse</option>
                            <option value="Normale">Normale</option>
                            <option value="Haute">Haute</option>
                        </select>
                    </div>

                    <div class="description">
                        <label for="">Description *</label>
                        <input type="text" id="description" placeholder="Décrivez votre problème ...">
                        <p class="erreur_description hidden">Enter une description valide</p>
                    </div>
                </div>

                <div class="add">
                    <button class="" id="add">+ Ajouter la demande</button>
                </div>
                <div class="add">
                    <button class="hidden" id="edit">Modifier le demande</button>
                </div>
            </form>
        </section>

            <div class="hero">

                <span class="nbr_demande"></span>
                <div class="switch hide_switch">
                    <button id="card" class="carte selected">▦ Cartes</button>

                </div>
